name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check src tests integration scripts
      - run: uv run --frozen ruff check src tests integration scripts
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -q
      - run: uv build
      - name: The built wheel works in a fresh environment (FastAPI, Flask)
        run: PYTHON="${{ matrix.python }}" scripts/check-consumer.sh
